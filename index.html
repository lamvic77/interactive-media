<h1>

</h1>

<p class="top">

<div class="soundscape">

    <h2>Relive the Night</h2>

    <p>Listen to the sounds of my concert experience.</p>

    <audio controls>
        <source src="intro.mp3" type="audio/mpeg">
    </audio>

</div>




<div class="slideshow">

    <button class="arrow left" onclick="changeSlide(-1)" aria-label="Previous video">
        &#10094;
    </button>

    <div class="slide">
    <iframe
        class="concert-video"
        src="https://www.youtube.com/embed/dIQnOzTdvCA?enablejsapi=1&origin=https://lamvic77.github.io"
        referrerpolicy="strict-origin-when-cross-origin"
        title="Lover Girl"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>

    <p class="song-title">"Lover Girl"</p>
</div>

    <div class="slide">
        <iframe class="concert-video"
            src="https://www.youtube.com/embed/NcAInsSFHdM"
            title="Silver Lining"
            referrerpolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"

            allowfullscreen>
        </iframe>
        <p class="song-title">"Silver Lining"</p>
    </div>

    <div class="slide">
        <iframe class="concert-video"
            src="https://www.youtube.com/embed/Cdye4YuGmEQ"
            title="Too Little, Too Late"
            referrerpolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"

            allowfullscreen>
        </iframe>
        <p class="song-title">"Too Little, Too Late"</p>
    </div>

    <div class="slide">
        <iframe class="concert-video"
            src="https://www.youtube.com/embed/laWWibQ5dN4"
            title="Sabatoge"
            referrerpolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"

            allowfullscreen>
        </iframe>
        <p class="song-title">"Sabatoge"</p>
    </div>

    <button class="arrow right" onclick="changeSlide(1)" aria-label="Next video">
        &#10095;
    </button>

</div>
